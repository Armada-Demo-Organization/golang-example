# Added for the Armada demo estate: publishes analysis to the local SonarQube
# (exposed via ngrok) against the project key the instance actually uses.
#
# The explicit -Dsonar.projectKey is deliberate. These repos are Master
# Template sources and carry either no key or a legacy one from the public
# repo they were copied from; the "armada-demo_" prefix is applied by Armada's
# seeding, not by the repo. Setting it on the command line overrides
# sonar-project.properties WITHOUT editing repo content, so the template does
# not drift for future demos.
name: SonarQube Analyze

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarqube:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for accurate new-code attribution
      - name: SonarQube analysis
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=armada-demo_golang-example
